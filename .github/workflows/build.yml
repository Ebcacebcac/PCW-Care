name: Build

on:
  push:
    branches: ['**']
    tags: ['v*']
  pull_request:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  check:
    name: Typecheck, lint, test (Linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - name: Self-test (collectors degrade to "unknown" on Linux)
        run: node dist/main/collect-cli.js

  selftest:
    name: Self-test on ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build:main
      - name: Collect a real health snapshot
        shell: bash
        run: |
          node dist/main/collect-cli.js --full > snapshot.json
          cat snapshot.json
      - uses: actions/upload-artifact@v4
        with:
          name: snapshot-${{ matrix.os }}
          path: snapshot.json

  # ── Releases: push a tag vX.Y.Z (matching package.json) ──

  release-draft:
    name: Create draft release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [check, selftest]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Tag must match package.json version
        run: |
          v="v$(node -p "require('./package.json').version")"
          if [ "$v" != "${GITHUB_REF_NAME}" ]; then
            echo "::error::Tag ${GITHUB_REF_NAME} does not match package.json version ${v}"; exit 1
          fi
      - name: Create the draft (if it doesn't exist yet)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 || \
            gh release create "$GITHUB_REF_NAME" --draft --title "PCW Care ${GITHUB_REF_NAME#v}" --generate-notes

  installers:
    name: Installers (${{ matrix.os }})
    needs: release-draft
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: --win --x64
          - os: macos-latest
            target: --mac --universal
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Build and upload to the draft release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npx electron-builder ${{ matrix.target }} --publish always

  release-publish:
    name: Publish release
    needs: installers
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Make the release public (the auto-updater ignores drafts)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release view "$GITHUB_REF_NAME" --json assets --jq '.assets[].name'
          gh release edit "$GITHUB_REF_NAME" --draft=false --latest
