name: Build

on:
  push:
    branches: ['**']
    tags: ['v*']
  pull_request:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  # Never cancel main or tag runs half-way through a release.
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' && !startsWith(github.ref, 'refs/tags/') }}

jobs:
  check:
    name: Typecheck, lint, test (Linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - name: Self-test (collectors degrade to "unknown" on Linux)
        run: node dist/main/collect-cli.js

  selftest:
    name: Self-test on ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build:main
      - name: Collect a real health snapshot
        shell: bash
        run: |
          node dist/main/collect-cli.js --full > snapshot.json
          cat snapshot.json
      - name: Summarise the snapshot
        run: node scripts/annotate-snapshot.mjs snapshot.json
      - name: Clear temporary files on a real machine
        run: node scripts/check-temp-clean.cjs
      - name: Detect PCW-Connect on a real machine
        run: node scripts/check-connect-detect.cjs
      - uses: actions/upload-artifact@v4
        with:
          name: snapshot-${{ matrix.os }}
          path: snapshot.json

  # ── Releases ──
  # Bump "version" in package.json and push to main: if there is no tag
  # v<version> yet, this builds the installers and publishes the release
  # (GitHub creates the tag when the release is published). Pushing a tag
  # vX.Y.Z that matches package.json works too.

  release-plan:
    name: Release needed?
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    needs: [check, selftest]
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.plan.outputs.tag }}
      release: ${{ steps.plan.outputs.release }}
    steps:
      - uses: actions/checkout@v4
      - id: plan
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          tag="v$(node -p "require('./package.json').version")"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            if [ "$GITHUB_REF_NAME" != "$tag" ]; then
              echo "::error::Tag ${GITHUB_REF_NAME} does not match package.json version ${tag}"; exit 1
            fi
            echo "release=true" >> "$GITHUB_OUTPUT"
          elif git ls-remote --exit-code --tags origin "refs/tags/$tag" >/dev/null; then
            echo "$tag is already released — nothing to do."
            echo "release=false" >> "$GITHUB_OUTPUT"
          elif gh release view "$tag" --json isDraft --jq .isDraft 2>/dev/null | grep -q false; then
            echo "release=false" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::Releasing $tag from ${GITHUB_SHA::7}"
            echo "release=true" >> "$GITHUB_OUTPUT"
          fi

  release-draft:
    name: Create draft release
    needs: release-plan
    if: needs.release-plan.outputs.release == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Create the draft (if it doesn't exist yet)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ needs.release-plan.outputs.tag }}
        run: |
          gh release view "$TAG" >/dev/null 2>&1 || \
            gh release create "$TAG" --draft --target "$GITHUB_SHA" --generate-notes \
              --title "PCW Care ${TAG#v}$(case "$TAG" in v0.*) echo ' (beta)';; esac)"

  installers:
    name: Installers (${{ matrix.os }})
    needs: [release-plan, release-draft]
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: --win --x64
          - os: macos-latest
            target: --mac --universal
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Build and upload to the draft release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npx electron-builder ${{ matrix.target }} --publish always

  release-publish:
    name: Publish release
    needs: [release-plan, installers]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Make the release public (the auto-updater ignores drafts)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ needs.release-plan.outputs.tag }}
        run: |
          gh release view "$TAG" --json assets --jq '.assets[].name'
          gh release edit "$TAG" --draft=false --latest
