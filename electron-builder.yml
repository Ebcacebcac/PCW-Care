# electron-builder configuration — see README "Releasing".
appId: uk.co.pcworkshop.care
productName: PCW Care
copyright: Copyright © 2026 PC Workshop Ltd
directories:
  output: release
  buildResources: build
files:
  - dist/**/*
  - package.json
extraResources:
  - from: resources
    to: resources
asar: true

# Auto-update feed (latest.yml / latest-mac.yml) and installers go to the
# GitHub Release for the tag. CI creates the draft release and publishes it
# once both platforms have uploaded.
publish:
  provider: github
  owner: Ebcacebcac
  repo: PCW-Care
  releaseType: draft

win:
  target:
    - target: nsis
      arch: [x64]
  icon: build/icon.ico
  # No code-signing certificate yet: don't try to sign, and don't make the
  # updater insist on a signature it can't verify.
  signExecutable: false
  verifyUpdateCodeSignature: false
  artifactName: PCW-Care-Setup-${version}.${ext}

nsis:
  oneClick: true
  perMachine: false
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: PCW Care
  runAfterFinish: true
  deleteAppDataOnUninstall: false

mac:
  target:
    - target: dmg
      arch: [universal]
    - target: zip
      arch: [universal]
  icon: build/icon.icns
  category: public.app-category.utilities
  # No Apple Developer ID yet: ad-hoc sign ("-") so Apple Silicon will run
  # it. Hardened runtime off because ad-hoc signatures can't satisfy its
  # library validation; no notarisation without an Apple account.
  identity: '-'
  hardenedRuntime: false
  gatekeeperAssess: false
  notarize: false
  artifactName: PCW-Care-${version}-mac-${arch}.${ext}

dmg:
  title: PCW Care ${version}
  artifactName: PCW-Care-${version}.${ext}

linux:
  # Only used to test packaging on Linux CI/sandboxes; not distributed.
  target: [dir]
  category: Utility
  icon: build/icon.png
